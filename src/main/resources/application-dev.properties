# ============================================================
# DEV PROFILE — application-dev.properties
# Activate with: SPRING_PROFILES_ACTIVE=dev
# ============================================================

# Thymeleaf — disable template cache so files reload on every request
spring.thymeleaf.cache=false

# H2 Console — enabled locally for debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Cookie security — not required over plain HTTP in local dev
COOKIE_SECURE=false
