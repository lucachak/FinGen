# PERFIL DE PRODUÇÃO: POSTGRESQL
# ════════════════════════════════════════

spring.datasource.url=${DATABASE_URL:${DB_URL}}
spring.datasource.username=${DB_USERNAME:${DB_USER}}
spring.datasource.password=${DB_PASSWORD:${DB_PASS}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=false

# Existing installations are baselined at version 1; incremental migrations run
# before Hibernate validates/updates the mapped entities.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
