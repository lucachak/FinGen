spring.datasource.url=${DATABASE_URL:${DB_URL}}
spring.datasource.username=${DB_USERNAME:${DB_USER}}
spring.datasource.password=${DB_PASSWORD:${DB_PASS}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# The project does not have a baseline migration yet. Keep Flyway disabled until
# the current production schema is baselined; enabling validate here prevents a
# clean deployment from starting.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
