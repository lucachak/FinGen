<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/layout :: layout('Automação de Contas',~{::main},~{::style},~{::script})}" lang="pt-BR">

<head>
  <style th:fragment="style"></style>
</head>

<body>
  <main>
    <div class="mb-8 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div>
        <h1 class="font-serif text-[32px] md:text-[40px] font-medium text-zen-t1 tracking-tight leading-tight mb-2">Automação de Contas</h1>
        <p class="text-[15px] text-zen-t3 font-light tracking-wide">Configure despesas fixas ou variáveis para a IA prever e lançar mensalmente.</p>
      </div>
      <a th:href="@{/app/financeiro/recorrentes/nova}" class="inline-flex items-center justify-center gap-2.5 px-6 py-3 bg-brand hover:bg-brand-h text-white rounded-full font-medium transition-colors shadow-sm text-[14px]">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
        Nova Automação
      </a>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5 animate-[fade-up_.35s_ease_both]">
      <div class="bg-zen-surface border border-zen-border rounded-[24px] p-6 flex flex-col transition-all hover:shadow-md hover:-translate-y-1 relative group" th:each="rec : ${recorrentes}">
        
        <!-- Toggle Status -->
        <div class="absolute top-6 right-6">
            <span class="w-3 h-3 rounded-full inline-block shadow-inner" th:classappend="${rec.automacaoAtiva ? 'bg-emerald-500 shadow-emerald-500/30' : 'bg-slate-300'}"></span>
        </div>

        <div class="flex items-center gap-4 mb-5">
          <div class="w-12 h-12 rounded-xl border flex items-center justify-center text-lg shrink-0"
               th:classappend="${rec.grupo.name() == 'VARIAVEL' ? 'bg-slate-50 border-slate-100 text-slate-500' : 'bg-brand/10 border-brand/20 text-brand'}">
            <!-- Icone Fixo (Cron) vs Variavel (IA) -->
            <svg th:if="${rec.grupo.name() == 'VARIAVEL'}" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            <svg th:if="${rec.grupo.name() == 'FIXA'}" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          </div>
          <div class="pr-6">
            <div class="text-[15px] font-semibold text-zen-t1 truncate" th:text="${rec.titulo}">Titulo</div>
            <div class="text-[12px] text-zen-t3 mt-1 truncate">
                Dia <span class="font-mono font-medium text-zen-t2" th:text="${rec.diaVencimento}">00</span> • 
                <span th:text="${rec.frequencia.name()}">FREQ</span>
            </div>
          </div>
        </div>

        <div class="text-[20px] font-serif font-medium text-zen-t1" th:text="'R$ ' + ${#numbers.formatDecimal(rec.valorBase,1,'POINT',2,'COMMA')}">
        </div>
        <div class="text-[11px] font-semibold text-zen-t3 mt-1 uppercase tracking-wider">Valor Base Padrão</div>

        <div class="flex items-center justify-between pt-5 border-t border-zen-border mt-5">
            <span class="text-[10.5px] font-semibold px-2.5 py-1 rounded-md uppercase tracking-wider" 
                th:classappend="${rec.grupo.name() == 'VARIAVEL' ? 'bg-slate-50 text-slate-600 border border-slate-100' : 'bg-slate-50 text-slate-600 border border-slate-200'}"
                th:text="${rec.grupo.name() == 'VARIAVEL' ? 'Previsão IA' : 'Fixo'}"></span>
          
            <div class="flex items-center gap-2">
                <a th:href="@{/app/financeiro/recorrentes/editar/{id}(id=${rec.id})}" class="inline-flex items-center justify-center w-8 h-8 rounded-lg border border-zen-border text-zen-t3 hover:text-brand hover:border-brand hover:bg-zen-surface2 transition-colors">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
                    </svg>
                </a>
                <form th:action="@{/app/financeiro/recorrentes/excluir/{id}(id=${rec.id})}" method="post" aria-label="Remover Lançamento Recorrente"
                    onsubmit="return confirm('Deseja realmente remover esta automação?')" class="inline m-0">
                    <button type="submit" class="inline-flex items-center justify-center w-8 h-8 rounded-lg border border-rose-200 bg-rose-50 text-rose-600 hover:bg-rose-100 transition-colors" aria-label="Remover Automação">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                        </svg>
                    </button>
                </form>
            </div>
        </div>

      </div>

      <!-- Empty State -->
      <div th:if="${#lists.isEmpty(recorrentes)}" class="col-span-1 sm:col-span-2 lg:col-span-3 xl:col-span-4 py-16 text-center text-[14.5px] text-zen-t3 border border-dashed border-zen-border bg-zen-surface rounded-[24px]">
        <svg class="w-12 h-12 mx-auto mb-4 text-zen-t3 opacity-30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/>
        </svg>
        <p>Nenhuma automação de cobrança configurada.</p>
        <p class="font-normal mt-1 opacity-80">A IA e o cron job poderão gerar suas faturas automaticamente se criar uma.</p>
      </div>

    </div>
  </main>
  <script th:fragment="script"></script>
</body>

</html>
