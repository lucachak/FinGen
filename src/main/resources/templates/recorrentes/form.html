<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(
          pageTitle=${recorrente.id == null ? 'Nova recorrência' : 'Editar recorrência'},
          content=~{::main},
          pageStyles=~{::style},
          pageScripts=~{::script}
      )}" lang="pt-BR">
<head>
  <style th:fragment="style"></style>
</head>

<body>
  <main class="max-w-[640px] mx-auto w-full">
    <a th:href="@{/app/financeiro/recorrentes}" class="inline-flex items-center gap-1.5 min-h-[44px] text-[14px] text-zen-t2 hover:text-zen-t1">
      <i data-lucide="arrow-left" class="w-4 h-4"></i>
      Voltar para contas recorrentes
    </a>

    <div class="page-header !mt-1">
      <h1 class="page-title" th:text="${recorrente.id == null ? 'Adicionar recorrência' : 'Editar recorrência'}">Adicionar recorrência</h1>
    </div>

    <form th:action="@{/app/financeiro/recorrentes/salvar}" th:object="${recorrente}" method="post" class="card p-5 md:p-6 space-y-4">
      <input type="hidden" th:field="*{id}" />

      <div>
        <label class="field-label" for="titulo">Nome</label>
        <input id="titulo" type="text" th:field="*{titulo}" class="field-control" placeholder="Ex.: Aluguel" required autocomplete="off">
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="field-label" for="inputEscopo">Espaço</label>
          <select th:field="*{escopo}" id="inputEscopo" class="field-control">
            <option th:each="esp : ${escopos}" th:value="${esp}" th:text="${esp.descricao}">Pessoal</option>
          </select>
        </div>
        <div>
          <label class="field-label" for="inputCategoria">Categoria</label>
          <select th:field="*{categoria.id}" id="inputCategoria" class="field-control">
            <option value="">Sem categoria</option>
            <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nome}" th:attr="data-escopo=${c.escopo}"></option>
          </select>
        </div>
        <div>
          <label class="field-label" for="tipo">Tipo</label>
          <select th:field="*{tipo}" id="tipo" class="field-control">
            <option th:each="t : ${tipos}" th:value="${t}"
                    th:text="${t.name() == 'RECEITA' ? 'Receita (entrada)' : 'Despesa (saída)'}">Despesa</option>
          </select>
        </div>
        <div>
          <label class="field-label" for="grupo">Valor</label>
          <select th:field="*{grupo}" id="grupo" class="field-control" aria-describedby="grupo-hint">
            <option value="FIXA">Fixo (aluguel, assinaturas)</option>
            <option value="VARIAVEL">Variável (luz, água, mercado)</option>
          </select>
        </div>
      </div>
      <p id="grupo-hint" class="field-hint !mt-0">No valor variável, o FinGen estima cada mês a partir das últimas contas pagas.</p>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div>
          <label class="field-label" for="frequencia">Repete</label>
          <select th:field="*{frequencia}" id="frequencia" class="field-control">
            <option th:each="f : ${frequencias}" th:value="${f}" th:text="${f.descricao}">Mensal</option>
          </select>
        </div>
        <div>
          <label class="field-label" for="diaVencimento">Dia do vencimento</label>
          <input id="diaVencimento" type="number" min="1" max="31" inputmode="numeric" th:field="*{diaVencimento}" class="field-control" required>
        </div>
        <div>
          <label class="field-label" for="valorBase">Valor base</label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-zen-t3 text-[14px]" aria-hidden="true">R$</span>
            <input id="valorBase" type="number" step="0.01" min="0" inputmode="decimal" th:field="*{valorBase}" class="field-control !pl-10" required>
          </div>
        </div>
      </div>

      <label class="flex items-start gap-3 min-h-[44px] p-3 border border-zen-border rounded-md cursor-pointer hover:bg-zen-surfaceH" for="automacaoAtiva">
        <input type="checkbox" id="automacaoAtiva" th:field="*{automacaoAtiva}" class="w-5 h-5 mt-0.5 accent-[color:var(--brand)] shrink-0">
        <span>
          <span class="block text-[14px] font-medium text-zen-t1">Lançar automaticamente</span>
          <span class="block text-[13px] text-zen-t3">Desmarcado, nenhuma conta é criada até você reativar.</span>
        </span>
      </label>

      <div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-3 pt-2">
        <a th:href="@{/app/financeiro/recorrentes}" class="btn-secondary">Cancelar</a>
        <button type="submit" class="btn-primary">Salvar recorrência</button>
      </div>
    </form>
  </main>

  <script th:fragment="script">
    document.addEventListener('DOMContentLoaded', () => {
      const escopo = document.getElementById('inputEscopo');
      const categoria = document.getElementById('inputCategoria');
      const filtrar = () => {
        let valida = !categoria.value;
        Array.from(categoria.options).forEach(opt => {
          if (!opt.value) return;
          const exibir = opt.dataset.escopo === escopo.value;
          opt.hidden = !exibir;
          opt.disabled = !exibir;
          if (exibir && opt.selected) valida = true;
        });
        if (!valida) categoria.value = '';
      };
      escopo.addEventListener('change', filtrar);
      filtrar();
    });
  </script>
</body>
</html>
