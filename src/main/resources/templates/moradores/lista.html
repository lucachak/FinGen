<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/layout :: layout('Moradores',~{::main},~{::style},~{::script})}" lang="pt-BR">

<head>
  <style th:fragment="style"></style>
</head>

<body>
  <main>
    <div class="mb-8 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div>
        <h1 class="font-serif text-[32px] md:text-[40px] font-medium text-zen-t1 tracking-tight leading-tight mb-2">Gestão da Casa</h1>
        <p class="text-[15px] text-zen-t3 font-light tracking-wide">Configure as informações do domicílio e quem tem acesso ao sistema.</p>
      </div>
      <a th:href="@{/app/settings/moradores/novo}" class="inline-flex items-center justify-center gap-2.5 px-6 py-3 bg-brand hover:bg-brand-h text-white rounded-full font-medium transition-colors shadow-sm text-[14px]">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
        Adicionar Morador
      </a>
    </div>

    <!-- Mensagens de Feedback -->
    <div th:if="${success}" class="bg-emerald-50 text-emerald-600 px-5 py-3.5 rounded-xl border border-emerald-100 mb-6 text-[13.5px] font-medium flex items-center gap-3">
        <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        <span th:text="${success}">Sucesso</span>
    </div>
    <div th:if="${error}" class="bg-rose-50 text-rose-600 px-5 py-3.5 rounded-xl border border-rose-100 mb-6 text-[13.5px] font-medium flex items-center gap-3">
        <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span th:text="${error}">Erro</span>
    </div>

    <!-- Abas de Navegação da Casa -->
    <div class="flex gap-6 border-b border-zen-border mb-8">
      <a href="#" class="text-[14px] font-medium pb-3 border-b-2 border-brand text-brand transition-colors">Moradores</a>
      <a href="#" class="text-[14px] font-medium pb-3 border-b-2 border-transparent text-zen-t3 opacity-60 cursor-not-allowed">Informações da Casa (Brevemente)</a>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5 animate-[fade-up_.35s_ease_both]">
      <div class="bg-zen-surface border border-zen-border rounded-[24px] p-6 flex flex-col transition-all hover:shadow-md hover:-translate-y-1" th:each="m : ${moradores}">
        <div class="flex items-center gap-4 mb-6">
          <div class="w-12 h-12 rounded-full bg-brand border border-brand overflow-hidden shadow-inner shrink-0 flex items-center justify-center text-white text-[17px] font-semibold">
            <img th:if="${m.fotoPerfil!=null}" th:src="@{${m.fotoPerfil}}" class="w-full h-full object-cover" alt="Foto do morador">
            <span th:unless="${m.fotoPerfil!=null}" th:text="${m.nomeCompleto!=null?#strings.substring(m.nomeCompleto,0,1).toUpperCase():'U'}">U</span>
          </div>
          <div class="min-w-0">
            <div class="text-[15px] font-semibold text-zen-t1 truncate" th:text="${m.nomeCompleto}">Nome</div>
            <div class="text-[12px] text-zen-t3 mt-0.5 truncate" th:text="${m.email}">email</div>
          </div>
        </div>
        <div class="flex items-center justify-between pt-5 border-t border-zen-border mt-auto">
          <span class="text-[10px] font-semibold px-3 py-1 rounded-full uppercase tracking-widest" 
                th:classappend="${m.role=='ROLE_ADMIN' ? 'bg-brand/10 text-brand border-brand/20 border' : 'bg-slate-50 text-slate-500 border border-slate-200'}"
                th:text="${m.role=='ROLE_ADMIN'?'Admin':'Morador'}"></span>
          <div class="flex items-center gap-2">
            <a th:href="@{/app/settings/moradores/editar/{id}(id=${m.id})}" class="inline-flex items-center gap-1.5 px-3 py-1.5 border border-zen-border rounded-lg text-[12px] font-medium text-zen-t2 hover:bg-zen-surface2 transition-colors">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20h9" />
                <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
              </svg>
              Editar
            </a>
            <form th:action="@{/app/settings/moradores/remover/{id}(id=${m.id})}" method="post" 
                  onsubmit="return confirm('Deseja realmente remover este morador da casa?')"
                  aria-label="Remover Morador"
                  class="inline m-0">
                <button type="submit" class="inline-flex items-center gap-1.5 px-3 py-1.5 border border-rose-200 bg-rose-50 text-rose-600 rounded-lg text-[12px] font-medium hover:bg-rose-100 transition-colors" aria-label="Remover Morador">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script th:fragment="script"></script>
</body>

</html>
