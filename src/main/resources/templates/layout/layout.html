<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(pageTitle, content, pageStyles, pageScripts)"
  th:lang="${#locale.language + '-' + #locale.country}">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="_csrf" th:content="${_csrf.token}" />
  <meta name="_csrf_header" th:content="${_csrf.headerName}" />
  <script>
    if (localStorage.theme === 'dark') {
      document.documentElement.classList.add('dark')
    } else {
      document.documentElement.classList.remove('dark')
      localStorage.setItem('theme', 'light')
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    }
  </script>
  <title th:text="${pageTitle ?: 'FinGen'}">FinGen</title>
  <meta name="description" content="FinGen - Seu patrimônio sob controlo com inteligência artificial.">
  <meta property="og:title" th:content="${pageTitle ?: 'FinGen'}">
  <meta property="og:description" content="FinGen - Seu patrimônio sob controlo com inteligência artificial.">
  <meta property="og:type" content="website">
  <link rel="dns-prefetch" href="https://unpkg.com">

  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>

  <!-- Fonts -->

  <!-- Favicons -->
  <link rel="icon" type="image/png" th:href="@{/favicon-96x96.png}" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" />
  <link rel="shortcut icon" th:href="@{/favicon.ico}" />
  <link rel="apple-touch-icon" sizes="180x180" th:href="@{/apple-touch-icon.png}" />
  <meta name="apple-mobile-web-app-title" content="FinGen" />
  <link rel="manifest" th:href="@{/site.webmanifest}" />

  <!-- CSS compilado (frontend/ → static/css/app.css) -->
  <link rel="stylesheet" th:href="@{/css/app.css}">

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <!-- Lucide — carregado ANTES dos fragments para garantir disponibilidade -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.418.0/dist/umd/lucide.min.js"></script>


  <th:block th:replace="${pageStyles}"></th:block>
</head>

<body class="bg-zen-bg text-zen-t1 font-sans antialiased">
  <a href="#conteudo" class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-[100] btn-primary">Pular para o conteúdo</a>

  <div class="flex h-screen overflow-hidden" id="app-shell">

    <!-- SIDEBAR OVERLAY (mobile) -->
    <div class="fixed inset-0 bg-black/40 z-40 hidden" id="sidebarOverlay" onclick="closeSidebar()" aria-hidden="true"></div>

    <!-- SIDEBAR -->
    <th:block th:replace="~{fragments/sidebar :: sidebar}"></th:block>

    <!-- MAIN COLUMN -->
    <div id="conteudo" class="flex-1 flex flex-col md:ml-[232px] min-h-screen bg-zen-bg overflow-y-auto">

      <!-- NAVBAR -->
      <th:block th:replace="~{fragments/navbar :: navbar}"></th:block>

      <!-- PAGE CONTENT -->
      <div class="flex-1 px-4 py-6 md:px-8 md:py-8 flex flex-col">
        <th:block th:replace="${content}"></th:block>
      </div>

      <!-- FOOTER -->
      <th:block th:replace="~{fragments/footer :: footer}"></th:block>

    </div>
  </div>

  <script>
    lucide.createIcons();

    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    const hamburgerBtn = document.getElementById('hamburgerBtn');

    if (hamburgerBtn) {
      hamburgerBtn.addEventListener('click', () => {
        sidebar.classList.remove('-translate-x-full');
        overlay.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
      });
    }

    function closeSidebar() {
      sidebar.classList.add('-translate-x-full');
      overlay.classList.add('hidden');
      document.body.style.overflow = '';
    }

    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSidebar(); });

    // Confirmação declarativa: <form data-confirm="Excluir a meta X?"> — o texto vem escapado pelo Thymeleaf.
    document.addEventListener('submit', (e) => {
      const msg = e.target && e.target.dataset ? e.target.dataset.confirm : null;
      if (msg && !window.confirm(msg)) e.preventDefault();
    });

    document.addEventListener('htmx:beforeSwap', () => {
      if (window.gsapCtx) window.gsapCtx.revert();
    });

    // FIX #7 — CSRF global para fetch() via header (padrão Spring Security)
    // Todos os fetch() podem usar este helper em vez de query params
    window.getCsrfHeaders = function () {
      const token = document.querySelector('meta[name="_csrf"]')?.content;
      const header = document.querySelector('meta[name="_csrf_header"]')?.content;
      return token && header ? {[header]: token} : {};
    };
  </script>

  <th:block th:replace="${pageScripts}"></th:block>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => { });
      });
    }
  </script>
</body>

</html>
