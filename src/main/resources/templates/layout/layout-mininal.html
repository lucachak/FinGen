<!-- ================================================================
  LAYOUT MINIMAL (layout-mininal.html)
  Used for pages without sidebar (e.g. login)
================================================================ -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(pageTitle, content, pageStyles, pageScripts)" lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${pageTitle ?: 'FinGen'}">FinGen</title>
  <meta name="description" content="Acesse a sua conta FinGen e gira o seu património com clareza e inteligência artificial.">
  <meta property="og:title" th:content="${pageTitle ?: 'FinGen'}">
  <meta property="og:description" content="FinGen — O seu gestor de patrimônio inteligente.">
  <meta property="og:type" content="website">
  <script>
    if (localStorage.theme === 'dark') {
      document.documentElement.classList.add('dark')
    } else {
      document.documentElement.classList.remove('dark')
      localStorage.setItem('theme', 'light')
    }
  </script>
  <link rel="icon" type="image/png" th:href="@{/favicon-96x96.png}" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" />
  <link rel="shortcut icon" th:href="@{/favicon.ico}" />
  <link rel="apple-touch-icon" sizes="180x180" th:href="@{/apple-touch-icon.png}" />
  <meta name="apple-mobile-web-app-title" content="FinGen" />
  <link rel="manifest" th:href="@{/site.webmanifest}" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --brand: #09090b; --brand-h: #18181b; --border: #e4e4e7;
      --text: #09090b; --text-muted: #71717a; --bg: #fdfdfd; --surface: #ffffff;
      --blue: #09090b; --blue-light: #f4f4f5;
    }
    html.dark {
      --brand: #fafafa; --brand-h: #e4e4e7; --border: #27272a;
      --text: #fafafa; --text-muted: #a1a1aa; --bg: #09090b; --surface: #18181b;
      --blue: #fafafa; --blue-light: #27272a;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; min-height: 100vh; -webkit-font-smoothing: antialiased; letter-spacing: -0.01em; }
  </style>
  <th:block th:replace="${pageStyles}"/>
</head>
<body>
<main style="padding: 32px;">
  <th:block th:replace="${content}"/>
</main>
<th:block th:replace="${pageScripts}"/>
</body>
</html>
