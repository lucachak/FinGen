<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">

<head>
    <meta charset="UTF-8">
</head>

<body>

    <header th:fragment="navbar"
        class="sticky top-0 z-30 h-[56px] bg-zen-surface border-b border-zen-border shrink-0">
        <div class="flex items-center justify-between h-full px-4 md:px-8 gap-3">

            <div class="flex items-center gap-2 min-w-0">
                <button id="hamburgerBtn" type="button"
                    class="md:hidden flex items-center justify-center w-11 h-11 -ml-2 rounded-md text-zen-t2 hover:bg-zen-surfaceH transition-colors"
                    aria-label="Abrir menu" aria-controls="sidebar">
                    <i data-lucide="menu" class="w-5 h-5"></i>
                </button>
                <span class="text-[14px] font-medium text-zen-t1 truncate" th:text="${pageTitle}">Página</span>
            </div>

            <div class="flex items-center gap-2">
                <a th:unless="${activeMenu == 'contas'}" th:href="@{/app/financeiro/contas/nova}" class="btn-primary !min-h-[40px]">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">Adicionar conta</span>
                    <span class="sm:hidden sr-only">Adicionar conta</span>
                </a>

                <button id="themeToggleBtn" type="button" onclick="toggleTheme()"
                    class="w-11 h-11 md:w-10 md:h-10 flex items-center justify-center rounded-md text-zen-t2 hover:bg-zen-surfaceH hover:text-zen-t1 transition-colors"
                    aria-label="Alternar entre tema claro e escuro" title="Alternar tema">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-[18px] h-[18px] block dark:hidden" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-[18px] h-[18px] hidden dark:block" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>
                </button>
            </div>
        </div>
    </header>

</body>

</html>
