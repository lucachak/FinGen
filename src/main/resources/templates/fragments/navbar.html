<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">

<head>
    <meta charset="UTF-8">
</head>

<body>

    <header th:fragment="navbar"
        class="sticky top-0 z-30 h-[64px] bg-zen-surface/90 backdrop-blur-md border-b border-zen-border shrink-0">
        <div class="flex items-center justify-between h-full px-5 md:px-7">

            <!-- Left: Hamburger & Breadcrumb -->
            <div class="flex items-center gap-2 md:gap-3">
                <button id="hamburgerBtn"
                    class="md:hidden flex items-center justify-center w-9 h-9 rounded-md text-zen-t2 hover:bg-zen-surfaceH transition-colors"
                    aria-label="Abrir menu">
                    <i data-lucide="menu" class="w-5 h-5"></i>
                </button>
                <div class="flex items-center gap-1.5 text-[13px] text-zen-t3">
                    <span class="hidden sm:inline">FinGen</span>
                    <i data-lucide="chevron-right" class="w-3 h-3 hidden sm:inline"></i>
                    <span class="text-zen-t1 font-medium" th:text="${pageTitle}">Página</span>
                </div>
            </div>

            <!-- Right: Actions & Profile -->
            <div class="flex items-center gap-2 md:gap-3">
                <a th:href="@{/app/financeiro/contas/nova}"
                    class="hidden sm:flex items-center gap-1.5 px-4 py-2 bg-brand hover:bg-brand-h text-white rounded-md text-[13px] font-medium transition-all shadow-[0_2px_8px_rgba(15,118,110,0.2)] hover:shadow-[0_4px_16px_rgba(15,118,110,0.30)]">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    Nova Despesa
                </a>

                <!-- FIX #3: theme toggle inline for HTMX compatibility -->
                <button id="themeToggleBtn" title="Alternar Tema" onclick="toggleTheme()"
                    class="relative w-9 h-9 flex items-center justify-center rounded-md border border-zen-border bg-zen-surface text-zen-t2 hover:bg-zen-surfaceH hover:text-zen-t1 active:scale-95 transition-all shadow-sm"
                    aria-label="Alternar tema">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 block dark:hidden"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 hidden dark:block text-amber-500"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>
                </button>

                <button title="Notificações"
                    class="relative w-9 h-9 flex items-center justify-center rounded-md border border-zen-border bg-zen-surface text-zen-t2 hover:bg-zen-surfaceH hover:text-zen-t1 transition-colors"
                    aria-label="Notificações">
                    <i data-lucide="bell" class="w-4 h-4"></i>
                    <span
                        class="absolute top-[5px] right-[5px] w-2 h-2 bg-red-600 rounded-full border-2 border-zen-surface"></span>
                </button>

                <img th:if="${user != null and user.fotoPerfil != null}" th:src="@{${user.fotoPerfil}}"
                    class="w-8 h-8 rounded-full object-cover bg-brand text-white flex items-center justify-center shrink-0 text-xs font-semibold ml-1"
                    alt="Avatar">
                <div th:unless="${user != null and user.fotoPerfil != null}"
                    class="w-8 h-8 rounded-full bg-brand text-white flex items-center justify-center shrink-0 text-xs font-semibold ml-1">
                    <a th:href="@{/app/settings/perfil}" class="no-underline text-inherit">
                        <span th:text="${user != null ? #strings.substring(user.email,0,1).toUpperCase() : 'U'}"></span>
                    </a>
                </div>
            </div>
        </div>
    </header>


</body>

</html>
