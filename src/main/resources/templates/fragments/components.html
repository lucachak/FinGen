<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head><meta charset="UTF-8"></head>
<body>

    <!-- Cartão: superfície com borda fina (sem sombra). -->
    <div th:fragment="card(class)" th:class="'card ' + (${class} ?: '')">
        <div th:replace="${content}"></div>
    </div>

    <!-- Botão primário. -->
    <button th:fragment="btn-primary(text, iconLucide, type, class)"
            th:type="${type ?: 'button'}"
            th:class="'btn-primary ' + (${class} ?: '')">
        <i th:if="${iconLucide}" th:attr="data-lucide=${iconLucide}" class="w-4 h-4"></i>
        <span th:text="${text}">Ação</span>
    </button>

    <!-- Selo de categoria: cor da categoria só no ponto, texto sempre legível. -->
    <span th:fragment="badge(text, color)" class="badge badge-gray">
        <span class="w-2 h-2 rounded-full shrink-0" th:style="'background:' + ${color}" aria-hidden="true"></span>
        <span th:text="${text}">Categoria</span>
    </span>

    <!-- Estado vazio: o que é, por que está vazio, como começar. -->
    <div th:fragment="empty(title, text)" class="empty-state">
        <p class="empty-state-title" th:text="${title}">Nada por aqui</p>
        <p class="empty-state-text" th:text="${text}">Texto de apoio.</p>
    </div>

</body>
</html>
