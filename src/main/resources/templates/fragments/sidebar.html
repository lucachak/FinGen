<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">

<head>
    <meta charset="UTF-8">
</head>

<body>

    <!-- Item de navegação. `key` casa com o `activeMenu` que cada controller define. -->
    <a th:fragment="item(href, key, icon, label, menu)" th:href="@{${href}}"
        class="group flex items-center gap-3 min-h-[40px] px-3 rounded-md text-[14px] transition-colors"
        th:classappend="${menu == key} ? 'bg-zen-surfaceH text-zen-t1 font-medium' : 'text-zen-t2 hover:bg-zen-surfaceH hover:text-zen-t1'"
        th:attr="aria-current=${menu == key} ? 'page' : null">
        <i th:attr="data-lucide=${icon}" class="w-[18px] h-[18px] shrink-0"
            th:classappend="${menu == key} ? 'text-brand' : 'text-zen-t3 group-hover:text-zen-t2'"></i>
        <span th:text="${label}">Item</span>
    </a>

    <aside th:fragment="sidebar" id="sidebar" aria-label="Menu principal"
        class="fixed inset-y-0 left-0 w-[232px] bg-zen-surface border-r border-zen-border flex flex-col z-50 transition-transform duration-200 -translate-x-full md:translate-x-0">

        <!-- Marca -->
        <a th:href="@{/app/dashboard}" class="flex items-center gap-2.5 px-5 h-[56px] border-b border-zen-border shrink-0 no-underline">
            <span class="w-7 h-7 bg-brand rounded-md flex items-center justify-center shrink-0" aria-hidden="true">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                    <path d="M4 18V9m6 9V5m6 13v-7m4 7H2" stroke="white" stroke-width="2.5" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </span>
            <span class="text-[16px] font-semibold text-zen-t1 tracking-tight">FinGen</span>
        </a>

        <nav th:with="menu=${activeMenu ?: ''}" class="flex-1 overflow-y-auto px-3 py-4 flex flex-col gap-0.5">

            <th:block th:replace="~{:: item('/app/dashboard', 'dashboard', 'layout-dashboard', 'Início', ${menu})}"></th:block>
            <th:block th:replace="~{:: item('/app/financeiro/contas', 'contas', 'receipt', 'Contas', ${menu})}"></th:block>
            <th:block th:replace="~{:: item('/app/financeiro/recorrentes', 'automacao', 'repeat', 'Contas recorrentes', ${menu})}"></th:block>
            <th:block th:replace="~{:: item('/app/financeiro/orcamentos', 'orcamentos', 'wallet', 'Orçamentos', ${menu})}"></th:block>
            <th:block th:replace="~{:: item('/app/financeiro/setup', 'setup', 'sliders-horizontal', 'Distribuição da renda', ${menu})}"></th:block>

            <p class="px-3 pt-5 pb-1.5 text-[12px] font-medium text-zen-t3">Patrimônio</p>
            <th:block th:replace="~{:: item('/app/wealth/investimentos', 'investimentos', 'trending-up', 'Investimentos', ${menu})}"></th:block>
            <th:block th:replace="~{:: item('/app/financeiro/metas', 'metas', 'target', 'Metas', ${menu})}"></th:block>

            <p class="px-3 pt-5 pb-1.5 text-[12px] font-medium text-zen-t3">Ajuda</p>
            <th:block th:replace="~{:: item('/app/ia', 'ia', 'sparkles', 'Assistente', ${menu})}"></th:block>

            <th:block th:if="${user != null and user.role == 'ROLE_ADMIN'}">
                <p class="px-3 pt-5 pb-1.5 text-[12px] font-medium text-zen-t3">Casa</p>
                <th:block th:replace="~{:: item('/app/settings/moradores', 'moradores', 'users', 'Moradores', ${menu})}"></th:block>
            </th:block>
        </nav>

        <!-- Conta -->
        <div class="shrink-0 p-3 border-t border-zen-border">
            <a th:href="@{/app/settings/perfil}"
                class="flex items-center gap-2.5 p-2 rounded-md hover:bg-zen-surfaceH no-underline transition-colors">
                <img th:if="${user != null and user.fotoPerfil != null}" th:src="@{${user.fotoPerfil}}"
                    class="w-8 h-8 rounded-full object-cover" alt="">
                <span th:unless="${user != null and user.fotoPerfil != null}"
                    class="w-8 h-8 rounded-full bg-brand text-zen-inv flex items-center justify-center shrink-0 text-[13px] font-semibold"
                    aria-hidden="true"
                    th:text="${user != null ? #strings.toUpperCase(#strings.substring(user.nomeCompleto != null ? user.nomeCompleto : user.username, 0, 1)) : 'U'}">M</span>
                <span class="min-w-0">
                    <span class="block text-[13px] font-medium text-zen-t1 truncate"
                        th:text="${user != null ? (user.nomeCompleto != null ? user.nomeCompleto : user.username) : 'Conta'}">Conta</span>
                    <span class="block text-[12px] text-zen-t3 truncate" th:text="${user != null ? user.email : ''}">email</span>
                </span>
            </a>
            <form th:action="@{/logout}" method="post" class="m-0 mt-1">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit"
                    class="w-full flex items-center gap-3 min-h-[40px] px-3 rounded-md text-[14px] text-zen-t2 hover:bg-zen-surfaceH hover:text-zen-t1 transition-colors text-left bg-transparent border-none cursor-pointer">
                    <i data-lucide="log-out" class="w-[18px] h-[18px] text-zen-t3"></i>
                    Sair
                </button>
            </form>
        </div>
    </aside>

</body>

</html>
