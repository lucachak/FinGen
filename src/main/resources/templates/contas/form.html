<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(
          pageTitle=${conta.id == null ? 'Nova conta' : 'Editar conta'},
          content=~{::main},
          pageStyles=~{::style},
          pageScripts=~{::script}
      )}"
      lang="pt-BR">
<head>
    <style th:fragment="style">
        .check-row {
            display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 12px;
            border: 1px solid var(--border); border-radius: var(--r-md); cursor: pointer;
            transition: background-color .15s ease;
        }
        .check-row:hover { background: var(--surface-h); }
        .check-row input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--brand); flex-shrink: 0; cursor: pointer; }
        .form-section + .form-section { margin-top: 16px; }
    </style>
</head>

<body>
    <main th:fragment="content">
        <div class="max-w-[1040px] mx-auto w-full">

            <a th:href="@{/app/financeiro/contas}"
               class="inline-flex items-center gap-1.5 min-h-[44px] text-[14px] text-zen-t2 hover:text-zen-t1">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                Voltar para contas
            </a>

            <div class="page-header !mt-1">
                <h1 class="page-title" th:text="${conta.id == null ? 'Adicionar conta' : 'Editar conta'}">Adicionar conta</h1>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

                <form class="lg:col-span-7 min-w-0" th:action="@{/app/financeiro/contas/salvar}" th:object="${conta}"
                      method="post" enctype="multipart/form-data" aria-label="Dados da conta">
                    <input type="hidden" th:field="*{id}" />

                    <div th:if="${erroValidacao}" role="alert"
                         class="mb-4 card !border-[color:var(--red-b)] !bg-[color:var(--red-bg)] p-4 flex items-start gap-3">
                        <i data-lucide="alert-triangle" class="w-5 h-5 mt-0.5 text-[color:var(--red)] shrink-0"></i>
                        <div>
                            <p class="text-[14px] font-medium text-zen-t1">Não foi possível salvar</p>
                            <p class="text-[14px] text-zen-t2" th:text="${erroValidacao}">Mensagem de erro.</p>
                        </div>
                    </div>

                    <section class="card p-5 md:p-6 form-section" aria-labelledby="sec-conta">
                        <h2 id="sec-conta" class="text-[16px] font-semibold text-zen-t1 mb-4">A conta</h2>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div class="sm:col-span-2">
                                <label class="field-label" for="inputDesc">Descrição</label>
                                <input type="text" th:field="*{descricao}" id="inputDesc" class="field-control"
                                       placeholder="Ex.: Aluguel de outubro" required autocomplete="off">
                            </div>
                            <div>
                                <label class="field-label" for="inputValor">Valor</label>
                                <div class="relative">
                                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-zen-t3 text-[14px]" aria-hidden="true">R$</span>
                                    <input type="number" step="0.01" min="0.01" inputmode="decimal" th:field="*{valor}"
                                           id="inputValor" class="field-control !pl-10" placeholder="0,00" required>
                                </div>
                            </div>
                            <div>
                                <label class="field-label" for="inputData">Vencimento</label>
                                <input type="date" th:field="*{dataVencimento}" id="inputData" class="field-control" required>
                            </div>
                            <div>
                                <label class="field-label" for="inputTipo">Tipo</label>
                                <select th:field="*{tipo}" id="inputTipo" class="field-control">
                                    <option th:each="t : ${tipos}" th:value="${t}"
                                            th:text="${t.name() == 'RECEITA' ? 'Receita (entrada)' : 'Despesa (saída)'}">Despesa</option>
                                </select>
                            </div>
                            <div>
                                <label class="field-label" for="inputEscopo">Espaço</label>
                                <select th:field="*{escopo}" id="inputEscopo" class="field-control">
                                    <option th:each="escopo : ${escopos}" th:value="${escopo}"
                                            th:text="${escopo.descricao}">Pessoal</option>
                                </select>
                            </div>
                        </div>
                    </section>

                    <section class="card p-5 md:p-6 form-section" aria-labelledby="sec-classif">
                        <h2 id="sec-classif" class="text-[16px] font-semibold text-zen-t1 mb-4">Classificação</h2>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="field-label" for="inputCat">Categoria</label>
                                <select th:field="*{categoria}" id="inputCat" class="field-control">
                                    <option value="">Sem categoria</option>
                                    <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nome}"
                                            th:attr="data-escopo=${cat.escopo}"></option>
                                </select>
                            </div>
                            <div>
                                <label class="field-label" for="inputPrioridade">Prioridade</label>
                                <select th:field="*{prioridade}" id="inputPrioridade" class="field-control">
                                    <option th:each="p : ${prioridades}" th:value="${p}" th:text="${p.descricao}">Média</option>
                                </select>
                            </div>
                            <div class="sm:col-span-2">
                                <label class="field-label" for="inputAsset">Conta bancária ou carteira</label>
                                <select th:field="*{asset}" id="inputAsset" class="field-control" aria-describedby="asset-hint">
                                    <option value="">Nenhuma</option>
                                    <option th:each="a : ${assets}" th:value="${a.id}" th:text="${a.name}"></option>
                                </select>
                                <p id="asset-hint" class="field-hint">Receitas somam no saldo da conta escolhida e despesas descontam dele.</p>
                            </div>
                        </div>
                    </section>

                    <section class="card p-5 md:p-6 form-section" aria-labelledby="sec-situacao">
                        <h2 id="sec-situacao" class="text-[16px] font-semibold text-zen-t1 mb-4">Situação</h2>
                        <div class="space-y-3">
                            <label class="check-row" for="inputPaga">
                                <input type="checkbox" th:field="*{paga}" id="inputPaga">
                                <span>
                                    <span class="block text-[14px] font-medium text-zen-t1">Já foi paga ou recebida</span>
                                    <span class="block text-[13px] text-zen-t3">Marque se o dinheiro já saiu ou entrou.</span>
                                </span>
                            </label>

                            <label class="check-row" for="checkRecorrente">
                                <input type="checkbox" id="checkRecorrente" aria-controls="divRecorrencia">
                                <span>
                                    <span class="block text-[14px] font-medium text-zen-t1">Repetir nos próximos meses</span>
                                    <span class="block text-[13px] text-zen-t3">Cria a mesma conta nos meses seguintes.</span>
                                </span>
                            </label>

                            <div id="divRecorrencia" class="hidden">
                                <label class="field-label" for="inputMeses">Por quantos meses?</label>
                                <input type="number" id="inputMeses" name="mesesRecorrencia" min="1" max="60"
                                       class="field-control sm:max-w-[200px]" placeholder="Ex.: 12" inputmode="numeric">
                            </div>
                        </div>

                        <div class="mt-5">
                            <label class="field-label" for="archivoInput">Comprovante (opcional)</label>
                            <label for="archivoInput"
                                   class="flex items-center gap-3 min-h-[52px] px-3 border border-dashed border-zen-border2 rounded-md cursor-pointer hover:bg-zen-surfaceH transition-colors">
                                <i data-lucide="paperclip" class="w-4 h-4 text-zen-t3 shrink-0"></i>
                                <span id="fileInfo" class="text-[14px] text-zen-t2 truncate">Escolher arquivo (PDF, PNG ou JPG, até 5 MB)</span>
                            </label>
                            <input type="file" id="archivoInput" name="arquivo" class="sr-only" accept=".pdf,.png,.jpg,.jpeg">
                        </div>
                    </section>

                    <div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-3 mt-6">
                        <a th:href="@{/app/financeiro/contas}" class="btn-secondary">Cancelar</a>
                        <button type="submit" class="btn-primary"
                                th:text="${conta.id == null ? 'Salvar conta' : 'Salvar alterações'}">Salvar conta</button>
                    </div>
                </form>

                <!-- Como vai aparecer -->
                <aside class="lg:col-span-5 lg:sticky lg:top-[80px]" aria-labelledby="prev-titulo">
                    <div class="card p-5 md:p-6">
                        <h2 id="prev-titulo" class="text-[14px] text-zen-t3">Como vai aparecer</h2>
                        <div class="mt-4 flex items-start justify-between gap-4">
                            <div class="min-w-0">
                                <p id="prevDesc" class="text-[18px] font-medium text-zen-t1 break-words">Descrição da conta</p>
                                <p class="mt-1 text-[14px] text-zen-t2">
                                    <span id="prevData">Hoje</span>
                                    <span aria-hidden="true">·</span>
                                    <span id="prevCat">Sem categoria</span>
                                </p>
                            </div>
                            <span id="prevStatus" class="badge badge-amber shrink-0">Pendente</span>
                        </div>
                        <div class="mt-6 pt-4 border-t border-zen-border flex items-end justify-between gap-4">
                            <div>
                                <p class="text-[13px] text-zen-t3">Valor</p>
                                <p id="prevValor" class="text-[28px] font-semibold text-zen-t1">R$ 0,00</p>
                            </div>
                            <span id="prevTipoLabel" class="badge badge-gray">Despesa</span>
                        </div>
                    </div>
                </aside>
            </div>
        </div>
    </main>

    <script th:fragment="script">
        document.addEventListener('DOMContentLoaded', () => {
            const $ = (id) => document.getElementById(id);
            const scopeSelect = $('inputEscopo');
            const categorySelect = $('inputCat');

            // Só mostra categorias do espaço escolhido.
            const syncCategories = () => {
                const selectedScope = scopeSelect.value;
                let selectedStillVisible = !categorySelect.value;
                Array.from(categorySelect.options).forEach(option => {
                    if (!option.value) return;
                    const visible = option.dataset.escopo === selectedScope;
                    option.hidden = !visible;
                    option.disabled = !visible;
                    if (visible && option.selected) selectedStillVisible = true;
                });
                if (!selectedStillVisible) categorySelect.value = '';
            };

            const BADGE = { pendente: 'badge badge-amber shrink-0', paga: 'badge badge-green shrink-0',
                            receita: 'badge badge-green', despesa: 'badge badge-gray' };

            const update = () => {
                const valor = parseFloat($('inputValor').value || 0);
                $('prevDesc').textContent = $('inputDesc').value || 'Descrição da conta';
                $('prevValor').textContent = 'R$ ' + valor.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

                const opt = categorySelect.options[categorySelect.selectedIndex];
                $('prevCat').textContent = opt && opt.value ? opt.text : 'Sem categoria';

                const data = $('inputData').value;
                $('prevData').textContent = data
                    ? new Date(data + 'T12:00:00').toLocaleDateString('pt-BR', { day: 'numeric', month: 'short' })
                    : 'Hoje';

                const paga = $('inputPaga').checked;
                const receita = $('inputTipo').value === 'RECEITA';
                const status = $('prevStatus');
                status.textContent = paga ? (receita ? 'Recebida' : 'Paga') : 'Pendente';
                status.className = paga ? BADGE.paga : BADGE.pendente;

                const tipo = $('prevTipoLabel');
                tipo.textContent = receita ? 'Receita' : 'Despesa';
                tipo.className = receita ? BADGE.receita : BADGE.despesa;
            };

            scopeSelect.addEventListener('change', () => { syncCategories(); update(); });
            ['inputDesc', 'inputValor', 'inputData', 'inputTipo', 'inputCat', 'inputPaga'].forEach(id => {
                const el = $(id);
                if (el) { el.addEventListener('input', update); el.addEventListener('change', update); }
            });

            // Recorrência: um único listener no checkbox (o label já repassa o clique).
            $('checkRecorrente').addEventListener('change', (e) => {
                $('divRecorrencia').classList.toggle('hidden', !e.target.checked);
                if (!e.target.checked) $('inputMeses').value = '';
            });

            $('archivoInput').addEventListener('change', (e) => {
                $('fileInfo').textContent = e.target.files[0] ? e.target.files[0].name
                    : 'Escolher arquivo (PDF, PNG ou JPG, até 5 MB)';
            });

            syncCategories();
            update();
        });
    </script>
</body>
</html>
