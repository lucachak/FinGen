<!-- ═══════════════════════════════════════════════════════════════
     ARQUIVO: transacoes/lista.html  (histórico de transações)
═══════════════════════════════════════════════════════════════ -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/layout :: layout('Histórico de Transações',~{::main},~{::style},~{::script})}" lang="pt-BR">

<head>
  <style th:fragment="style"></style>
</head>

<body>
  <main>
    <div class="mb-8">
      <div>
        <h1 class="font-serif text-[32px] md:text-[40px] font-medium text-zen-t1 tracking-tight leading-tight mb-2">Histórico</h1>
        <p class="text-[15px] text-zen-t3 font-light tracking-wide">Todas as receitas e despesas consolidadas.</p>
      </div>
    </div>
    
    <div class="bg-zen-surface border border-zen-border rounded-[20px] overflow-hidden shadow-sm mb-8 animate-[fade-up_.35s_ease_both]">
      <div th:each="tx : ${transacoes}" class="flex items-center gap-4 py-3.5 px-6 border-b border-zen-border last:border-b-0 hover:bg-zen-surface2 transition-colors">
        
        <div class="w-11 h-11 rounded-full flex items-center justify-center shrink-0 border" 
             th:classappend="${tx.tipo.name() == 'RECEITA' ? 'bg-brand/10 text-brand border-brand/20' : 'bg-red-50 text-red-600 border-red-100'}">
          <!-- Lucide Icon for Arrow Up/Down -->
          <svg th:if="${tx.tipo.name() == 'RECEITA'}" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
          <svg th:if="${tx.tipo.name() == 'DESPESA'}" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
        </div>
        
        <div class="flex-1 min-w-0">
          <div class="text-[14.5px] font-medium text-zen-t1 truncate" th:text="${tx.descricao}">—</div>
          <div class="text-[12px] text-zen-t3 mt-1 flex items-center gap-2">
            <span th:if="${tx.responsavel != null}" th:text="${tx.responsavel.nomeCompleto}"></span>
            <span class="text-[10.5px] font-medium px-2 py-0.5 rounded-md bg-zen-surface2 text-zen-t2 border border-zen-border" th:if="${tx.categoria != null}" th:text="${tx.categoria.nome}"></span>
          </div>
        </div>
        
        <div class="text-right shrink-0">
          <div class="font-mono text-[15px] font-medium" th:classappend="${tx.tipo.name() == 'RECEITA' ? 'text-brand' : 'text-zen-t1'}"
            th:text="${(tx.tipo.name() == 'RECEITA' ? '+' : '−') + ' R$ ' + #numbers.formatDecimal(tx.valor,1,'POINT',2,'COMMA')}">
          </div>
          <div class="text-[11.5px] text-zen-t3 mt-1" th:text="${#temporals.format(tx.dataPagamento,'dd/MM/yyyy')}"></div>
        </div>
        
        <div class="flex gap-1.5 shrink-0 ml-4">
          <a th:if="${tx.comprovante != null}" th:href="@{'/uploads/'+${tx.comprovante}}" target="_blank"
            class="w-9 h-9 rounded-xl border border-zen-border flex items-center justify-center text-zen-t3 hover:bg-zen-surface2 hover:text-zen-t1 transition-colors group">
            <svg class="w-4.5 h-4.5 group-hover:scale-105 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
            </svg>
          </a>
          <a th:href="@{/app/financeiro/contas/editar/{id}(id=${tx.id})}" class="w-9 h-9 rounded-xl border border-zen-border flex items-center justify-center text-zen-t3 hover:bg-zen-surface2 hover:text-zen-t1 transition-colors group">
            <svg class="w-4.5 h-4.5 group-hover:scale-105 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 14.66V20a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h5.34" /><polygon points="18 2 22 6 12 16 8 16 8 12 18 2" />
            </svg>
          </a>
        </div>
        
      </div>
      
      <div class="py-16 px-6 text-center text-zen-t3" th:if="${#lists.isEmpty(transacoes)}">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 mx-auto mb-4 opacity-20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        <p class="text-[14.5px]">Nenhuma transação efetivada ainda.</p>
      </div>
    </div>
  </main>
  <script th:fragment="script"></script>
</body>

</html>
