<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/layout :: layout(
          pageTitle='Meta',
          content=~{::main},
          pageStyles=~{::style},
          pageScripts=~{::script}
      )}" lang="pt-BR">

<head>
  <style th:fragment="style">
    .zen-input:focus {
      background-color: white !important;
      border-color: var(--brand) !important;
      box-shadow: 0 0 0 4px rgba(20, 184, 166, 0.1) !important;
    }
  </style>
</head>

<body>
  <main>
    <div class="max-w-[1000px] mx-auto animate-[fade-up_.35s_ease_both]">
      <div class="mb-8 flex items-center justify-between">
        <div class="flex items-center gap-4">
          <a th:href="@{/app/financeiro/metas}" aria-label="Voltar para metas" class="group w-10 h-10 rounded-full border border-zen-border flex items-center justify-center hover:bg-zen-surface2 transition-all">
            <i data-lucide="arrow-left" class="w-5 h-5 text-zen-t3 group-hover:text-brand transition-colors"></i>
          </a>
          <div>
            <h1 class="font-serif text-[32px] font-medium text-zen-t1 tracking-tight" th:text="${meta.id == null ? 'Adicionar meta' : 'Editar meta'}">Meta</h1>
            <p class="text-[14px] text-zen-t3 font-light">Defina quanto quer juntar e até quando.</p>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        
        <!-- Form Column -->
        <div class="lg:col-span-7 bg-zen-surface border border-zen-border rounded-2xl overflow-hidden shadow-sm p-8">
          <form th:action="@{/app/financeiro/metas/salvar}" th:object="${meta}" method="post" class="flex flex-col gap-8">
            <input type="hidden" th:field="*{id}" />
            <input type="hidden" th:field="*{responsavel.id}" th:if="${meta.responsavel != null}" />
            <input type="hidden" th:field="*{icone}" id="iconeInput" />

            <div class="space-y-6">
              <!-- Título e Natureza -->
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <div class="flex flex-col gap-2">
                  <label class="field-label" for="tituloInput">Nome da meta</label>
                  <input type="text" th:field="*{titulo}" id="tituloInput" class="field-control" placeholder="Ex: Viagem para o Japão" required>
                </div>
                <div class="flex flex-col gap-2">
                  <label class="field-label" for="naturezaSelect">Tipo de objetivo</label>
                  <select th:field="*{natureza}" id="naturezaSelect" class="field-control">
                    <option th:each="n : ${naturezas}" th:value="${n}" th:text="${n.descricao}"></option>
                  </select>
                </div>
              </div>

              <!-- Valores -->
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <div class="flex flex-col gap-2">
                  <label class="field-label" for="valorAlvoInput">Valor da meta (R$)</label>
                  <div class="relative">
                    <span class="absolute left-5 top-1/2 -translate-y-1/2 text-zen-t3 tabular-nums">R$</span>
                    <input type="number" step="0.01" th:field="*{valorAlvo}" id="valorAlvoInput" class="field-control !pl-12 tabular-nums" placeholder="0.00" required>
                  </div>
                </div>
                <div class="flex flex-col gap-2">
                  <label class="field-label" for="valorAtualInput">Valor já guardado (R$)</label>
                  <div class="relative">
                    <span class="absolute left-5 top-1/2 -translate-y-1/2 text-zen-t3 tabular-nums">R$</span>
                    <input type="number" step="0.01" th:field="*{valorAtual}" id="valorAtualInput" class="field-control !pl-12 tabular-nums" placeholder="0.00" required>
                  </div>
                </div>
              </div>

              <!-- Prazo e Status -->
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <div class="flex flex-col gap-2">
                  <label class="field-label" for="prazoInput">Prazo</label>
                  <input type="date" th:field="*{prazo}" id="prazoInput" class="field-control">
                </div>
                <div class="flex flex-col gap-2">
                  <label class="field-label" for="statusSelect">Situação</label>
                  <select th:field="*{status}" id="statusSelect" class="field-control">
                    <option value="EM_ANDAMENTO">Em andamento</option>
                    <option value="CONCLUIDO">✅ Concluída</option>
                  </select>
                </div>
              </div>
            </div>

            <div class="flex gap-4 pt-8 border-t border-zen-border justify-end">
              <a th:href="@{/app/financeiro/metas}" class="px-6 py-3 text-[14.5px] font-medium text-zen-t3 hover:text-zen-t1 transition-colors">Cancelar</a>
              <button type="submit" class="px-8 py-3 bg-brand hover:bg-brand-h text-white rounded-2xl font-semibold transition-all shadow-lg text-[15px]">Salvar meta</button>
            </div>
          </form>
          
          <form th:if="${meta.id != null}" th:action="@{/app/financeiro/metas/excluir/{id}(id=${meta.id})}" method="post" class="mt-8 text-center border-t border-dashed border-[color:var(--red-b)] pt-6">
            <button type="submit" class="text-[13px] font-medium text-[color:var(--red)] hover:text-[color:var(--red)] transition-colors flex items-center justify-center gap-2 mx-auto">
              <i data-lucide="trash-2" class="w-4 h-4"></i> Excluir meta
            </button>
          </form>
        </div>

        <!-- Prévia -->
        <aside class="lg:col-span-5 lg:sticky lg:top-[80px]" aria-labelledby="prev-titulo">
          <div class="card p-5 md:p-6">
            <h2 id="prev-titulo" class="text-[14px] text-zen-t3">Como vai aparecer</h2>
            <div class="mt-4 flex items-center gap-3">
              <div id="previewIconContainer" class="w-11 h-11 rounded-lg bg-zen-surface2 border border-zen-border flex items-center justify-center text-brand shrink-0">
                <i data-lucide="target" id="previewIcon" class="w-5 h-5"></i>
              </div>
              <div class="min-w-0">
                <h3 id="previewTitle" class="text-[17px] font-medium text-zen-t1 truncate">Nome da meta</h3>
                <p id="previewNature" class="text-[13px] text-zen-t3">Tipo de objetivo</p>
              </div>
            </div>

            <div class="mt-5 flex items-baseline justify-between">
              <span class="text-[13px] text-zen-t3">Progresso</span>
              <span id="previewPercent" class="text-[22px] font-semibold text-zen-t1">0%</span>
            </div>
            <div class="meter mt-2"><div id="previewProgressBar" class="meter-fill" style="width:0%"></div></div>

            <dl class="mt-5 grid grid-cols-2 gap-3 text-[14px]">
              <div>
                <dt class="text-[13px] text-zen-t3">Valor da meta</dt>
                <dd id="previewAlvo" class="font-medium text-zen-t1">R$ 0,00</dd>
              </div>
              <div>
                <dt class="text-[13px] text-zen-t3">Prazo</dt>
                <dd id="previewPrazo" class="font-medium text-zen-t1">--/--/----</dd>
              </div>
            </dl>
          </div>

          <p class="mt-4 text-[14px] text-zen-t2">Defina um valor e um prazo para acompanhar o progresso da meta.</p>
        </aside>

      </div>
    </div>
  </main>
  
  <script th:fragment="script">
    document.addEventListener('DOMContentLoaded', function() {
      const inputs = {
        titulo: document.getElementById('tituloInput'),
        natureza: document.getElementById('naturezaSelect'),
        alvo: document.getElementById('valorAlvoInput'),
        atual: document.getElementById('valorAtualInput'),
        prazo: document.getElementById('prazoInput')
      };

      const previews = {
        titulo: document.getElementById('previewTitle'),
        natureza: document.getElementById('previewNature'),
        percent: document.getElementById('previewPercent'),
        progress: document.getElementById('previewProgressBar'),
        alvo: document.getElementById('previewAlvo'),
        prazo: document.getElementById('previewPrazo'),
        icon: document.getElementById('previewIcon')
      };

      const natureIcons = {
        'VIAGEM': 'palmtree',
        'CARRO': 'car',
        'CASA': 'home',
        'APOSENTADORIA': 'trending-up',
        'RESERVA_EMERGENCIA': 'shield-check',
        'EDUCACAO': 'graduation-cap',
        'OUTROS': 'target'
      };

      function updatePreview() {
        previews.titulo.textContent = inputs.titulo.value || 'Nome da meta';
        previews.natureza.textContent = inputs.natureza.options[inputs.natureza.selectedIndex].text;
        
        const alvo = parseFloat(inputs.alvo.value) || 0;
        const atual = parseFloat(inputs.atual.value) || 0;
        const percent = alvo > 0 ? Math.min((atual * 100 / alvo), 100).toFixed(0) : 0;

        previews.percent.textContent = percent + '%';
        previews.progress.style.width = percent + '%';
        previews.alvo.textContent = 'R$ ' + alvo.toLocaleString('pt-BR', { minimumFractionDigits: 2 });
        
        if (inputs.prazo.value) {
          const date = new Date(inputs.prazo.value);
          previews.prazo.textContent = date.toLocaleDateString('pt-BR');
        } else {
          previews.prazo.textContent = '--/--/----';
        }

        // Update Icon
        const nature = inputs.natureza.value;
        const iconName = natureIcons[nature] || 'target';
        previews.icon.setAttribute('data-lucide', iconName);
        lucide.createIcons();
      }

      Object.values(inputs).forEach(el => el.addEventListener('input', updatePreview));
      updatePreview();
    });
  </script>
</body>

</html>
