<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/layout :: layout('Orçamentos Pro Max',~{::main},~{::style},~{::script})}" lang="pt-BR">

<head>
  <style th:fragment="style">
    /* Bento Grid Layout */
    .budget-dashboard {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 20px;
      margin-bottom: 40px;
    }

    /* Summary Card (Span 12 for high level metrics) */
    .budget-summary {
      grid-column: span 12;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-xl);
      padding: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-image: radial-gradient(circle at top right, rgba(20, 184, 166, 0.05), transparent);
    }

    /* Budget Grid (Span 12 or 8 depending on secondary widgets) */
    .budget-grid {
      grid-column: span 12;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    /* Budget Card Zen Style */
    .budget-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 24px;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 20px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }

    .budget-card:hover {
      border-color: var(--brand);
      box-shadow: 0 10px 30px -10px rgba(0,0,0,0.05);
      transform: translateY(-4px);
    }

    /* Progress Ring SVG Container */
    .ring-container {
      position: relative;
      width: 70px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ring-container svg {
      transform: rotate(-90deg);
    }

    .ring-bg {
      fill: none;
      stroke: var(--surface-hover);
      stroke-width: 4;
    }

    .ring-fill {
      fill: none;
      stroke: var(--brand);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 207; /* 2 * PI * 33 */
      stroke-dashoffset: 207;
      transition: stroke-dashoffset 1s ease-out;
    }

    .ring-icon {
      position: absolute;
      color: var(--text-dim);
    }

    .budget-card.warning .ring-fill { stroke: #f59e0b; }
    .budget-card.danger .ring-fill { stroke: var(--accent-red); }

    .budget-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .cat-info h3 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    .cat-natureza {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-dim);
    }

    .amount-display {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .spent-val {
      font-size: 24px;
      font-weight: 800;
      font-family: var(--mono);
      color: var(--text);
      letter-spacing: -1px;
    }

    .limit-val {
      font-size: 13px;
      color: var(--text-dim);
      font-weight: 500;
    }

    .risk-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 99px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .risk-NORMAL { background: #f0fdf4; color: #166534; border: 1px solid #dcfce7; }
    .risk-ALERTA { background: #fffbeb; color: #92400e; border: 1px solid #fef3c7; }
    .risk-CRITICO { background: #fef2f2; color: #991b1b; border: 1px solid #fee2e2; }

    .empty-state {
      grid-column: span 12;
      padding: 80px 40px;
      text-align: center;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--r-xl);
    }

    [data-lucide] { width: 18px; height: 18px; }
  </style>
</head>

<body>
  <main>
    <div class="page-header">
      <div>
        <h1 class="page-title">Planejamento Pro Max</h1>
        <p class="page-subtitle">Monitoramento preditivo de orçamentos por categoria — <span th:text="${mesAtual}"></span>.</p>
      </div>
      <div class="flex gap-2">
        <form th:action="@{/app/financeiro/orcamentos/gerar-automatico(escopo=${escopoSelecionado})}" method="post" aria-label="Gerar Orçamento Automático">
          <button type="submit" class="btn-secondary">
            <i data-lucide="sparkles"></i>
            Gerar Automático
          </button>
        </form>
        <a th:href="@{/app/financeiro/orcamentos/novo(escopo=${escopoSelecionado})}" class="btn-primary">
          <i data-lucide="plus"></i>
          Novo Limite
        </a>
      </div>
    </div>

    <nav class="flex flex-wrap gap-2 mb-6" aria-label="Espaços financeiros">
      <a th:each="esp : ${escopos}" th:href="@{/app/financeiro/orcamentos(escopo=${esp})}"
         th:text="${esp.descricao}"
         th:classappend="${esp == escopoSelecionado} ? ' bg-brand text-white border-brand' : ' bg-zen-surface text-zen-t2 border-zen-border hover:border-brand'"
         class="px-4 py-2.5 rounded-xl border text-[13px] font-semibold transition-colors"></a>
    </nav>

    <!-- Alert Messages -->
    <div th:if="${successMessage}" class="alert-success mb-6" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert-error mb-6" th:text="${errorMessage}"></div>

    <div class="budget-dashboard">
      <!-- High Level Summary -->
      <div class="budget-summary" th:if="${not #lists.isEmpty(orcamentos)}">
        <div>
          <span class="cat-natureza">Foco Mensal</span>
          <h2 class="spent-val" th:text="${mesAtual}">Março</h2>
        </div>
        <div class="text-right">
          <span class="cat-natureza">Total Orçado</span>
          <div class="spent-val">
            R$ <span th:text="${#numbers.formatDecimal(totalOrcado, 1, 'POINT', 2, 'COMMA')}">0</span>
          </div>
        </div>
      </div>

      <!-- Budget Cards Loop -->
      <div class="budget-grid">
        <div th:each="orc : ${orcamentos}" 
             th:with="pct=${percentuais[orc.id]}, 
                      gasto=${gastosAtuais[orc.id]}, 
                      risco=${statusRisco[orc.id]}"
             class="budget-card opacity-0 translate-y-4"
             th:classappend="${risco == 'CRITICO' ? 'danger' : (risco == 'ALERTA' ? 'warning' : '')}">
          
          <div class="budget-card-header">
            <div class="ring-container">
              <svg width="70" height="70">
                <circle class="ring-bg" cx="35" cy="35" r="33"></circle>
                <circle class="ring-fill" cx="35" cy="35" r="33" 
                        th:attr="data-pct=${pct > 100 ? 100 : pct}"></circle>
              </svg>
              <div class="ring-icon">
                <i th:data-lucide="${orc.categoria.icone}"></i>
              </div>
            </div>
            
            <div class="flex flex-col items-end gap-2">
              <span class="risk-badge" th:classappend="'risk-' + ${risco}" th:text="${risco}"></span>
              <div class="flex gap-1">
                <a th:href="@{/app/financeiro/orcamentos/editar/{id}(id=${orc.id})}" class="p-1 hover:text-brand transition-colors">
                  <i data-lucide="edit-3" class="w-4 h-4"></i>
                </a>
                <form th:action="@{/app/financeiro/orcamentos/excluir/{id}(id=${orc.id})}" method="post" onsubmit="return confirm('Remover?')" aria-label="Remover Limite">
                  <button type="submit" class="p-1 hover:text-red-500 transition-colors" aria-label="Excluir Limite">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                  </button>
                </form>
              </div>
            </div>
          </div>

          <div class="cat-info">
            <h3 th:text="${orc.categoria.nome}">Categoria</h3>
            <span class="cat-natureza" th:text="${orc.categoria.natureza != null ? orc.categoria.natureza.descricao : 'Geral'}">Descrição</span>
          </div>

          <div class="amount-display">
            <div class="spent-val">
              R$ <span th:text="${#numbers.formatDecimal(gasto, 1, 'POINT', 2, 'COMMA')}">0</span>
            </div>
            <div class="limit-val">
              de R$ <span th:text="${#numbers.formatDecimal(orc.limiteMensal, 1, 'POINT', 2, 'COMMA')}">0</span> orçados
            </div>
          </div>

          <!-- Pct Label -->
          <div class="absolute bottom-6 right-6 font-mono font-bold text-lg text-brand" 
               th:classappend="${risco == 'CRITICO' ? 'text-red-500' : (risco == 'ALERTA' ? 'text-amber-500' : '')}"
               th:text="|${#numbers.formatDecimal(pct, 1, 'POINT', 1, 'COMMA')}%|">0%</div>
        </div>

        <!-- Empty State -->
        <div th:if="${#lists.isEmpty(orcamentos)}" class="empty-state">
          <i data-lucide="layout-grid" class="w-12 h-12 text-dim mx-auto mb-4"></i>
          <h2 class="text-xl font-bold mb-2">Nenhum limite definido</h2>
          <p class="text-dim mb-6">Mantenha sua saúde financeira em dia definindo limites por categoria.</p>
          <a th:href="@{/app/financeiro/orcamentos/novo(escopo=${escopoSelecionado})}" class="btn-primary inline-flex">
            Começar Agora
          </a>
        </div>
      </div>
    </div>
  </main>

  <script th:fragment="script">
    document.addEventListener('DOMContentLoaded', () => {
      // Initialize GSAP
      const ctx = gsap.context(() => {
        // Animate Cards
        gsap.to('.budget-card', {
          opacity: 1,
          y: 0,
          stagger: 0.1,
          duration: 0.8,
          ease: 'power2.out'
        });

        // Animate Progress Rings
        const fullOffset = 207;
        document.querySelectorAll('.ring-fill').forEach(ring => {
          const pct = parseFloat(ring.getAttribute('data-pct'));
          const offset = fullOffset - (fullOffset * pct / 100);
          
          gsap.to(ring, {
            strokeDashoffset: offset,
            duration: 1.5,
            delay: 0.5,
            ease: 'power2.out'
          });
        });
      });

      // Re-initialize Lucide
      lucide.createIcons();

      // Cleanup for HTMX
      document.addEventListener('htmx:beforeSwap', () => ctx.revert());
    });
  </script>
</body>

</html>
