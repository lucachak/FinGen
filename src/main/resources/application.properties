spring.application.name=FinGen

openrouter.api.key=${OPENROUTER_API_KEY}
# Thymeleaf — disable template cache in dev (reads files fresh on every request)
spring.thymeleaf.cache=false

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=30MB

server.tomcat.max-http-form-post-size=30MB
server.tomcat.max-swallow-size=-1

python.microservice.url=http://127.0.0.1:8000

# ════════════════════════════════════════
# 1. BASE DE DADOS PERSISTENTE (H2 FILE)
# ════════════════════════════════════════
spring.datasource.url=jdbc:h2:file:./data/fingen;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Permite ver a consola H2 em /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate Auto-DDL: Set up as update since there are no migration files like Flyway
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true