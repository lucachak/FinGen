spring.application.name=FinGen
server.port=${SERVER_PORT:${PORT:8081}}

openrouter.api.key=${OPENROUTER_API_KEY:default-key-not-set}

# JWT
application.security.jwt.secret-key=${JWT_SECRET:}
application.security.jwt.expiration=86400000

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=30MB

server.tomcat.max-http-form-post-size=30MB
server.tomcat.max-swallow-size=-1

python.microservice.url=${PYTHON_API_URL:http://127.0.0.1:8000}

# ════════════════════════════════════════
# 1. BASE DE DADOS LOCAL
# ════════════════════════════════════════
# Plain `./mvnw spring-boot:run` is intentionally self-contained. Docker and
# production override these standard Spring variables in their own profiles.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/fingen-local;DB_CLOSE_DELAY=-1;AUTO_RECONNECT=TRUE;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# H2 Console — disabled by default in production; set H2_CONSOLE_ENABLED=true locally
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Hibernate Auto-DDL: Set up as update since there are no migration files like Flyway
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

spring.flyway.enabled=false

# Fail fast on unavailable database connections and shut down gracefully.
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.lifecycle.timeout-per-shutdown-phase=20s
server.shutdown=graceful
spring.data.web.pageable.max-page-size=100

# Session Cookie Security
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax

# ════════════════════════════════════════
# 2. IA (OpenRouter)
# ════════════════════════════════════════
# Modelo usado quando o usuário não escolheu nenhum, modelo de reserva (quando o
# escolhido está fora do ar ou limitado) e modelo para ler imagens. O usuário
# escolhe o seu pela tela de IA; só entram na lista modelos gratuitos, a menos
# que AI_ALLOW_PAID_MODELS=true. O serviço Python lê as mesmas AI_MODEL_*.
ai.openrouter.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
ai.model.default=${AI_MODEL_DEFAULT:openrouter/free}
ai.model.fallback=${AI_MODEL_FALLBACK:google/gemma-3-27b-it:free}
ai.model.vision=${AI_MODEL_VISION:google/gemma-3-27b-it:free}
ai.allow-paid-models=${AI_ALLOW_PAID_MODELS:false}
ai.catalog.ttl-minutes=60
app.base-url=${BASE_URL:http://localhost:8081}

# ════════════════════════════════════════
# 3. PERFORMANCE
# ════════════════════════════════════════
# Associações LAZY restantes são carregadas em lotes (evita N+1 residual).
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# Compressão das respostas HTTP (JSON/HTML/CSS/JS).
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
# Nome do arquivo estático com hash do conteúdo (cache longo sem servir CSS velho após deploy).
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**,/js/**
