spring.application.name=FinGen

openrouter.api.key=${OPENROUTER_API_KEY:default-key-not-set}

# JWT
application.security.jwt.secret-key=${JWT_SECRET:0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF}
application.security.jwt.expiration=86400000

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=30MB

server.tomcat.max-http-form-post-size=30MB
server.tomcat.max-swallow-size=-1

python.microservice.url=${PYTHON_API_URL:http://127.0.0.1:8000}

# ════════════════════════════════════════
# 1. BASE DE DADOS (H2, LOCAL POSTGRES OU SUPABASE)
# ════════════════════════════════════════
spring.datasource.url=${SUPABASE_DB_URL:${DB_URL:jdbc:h2:file:./data/fingen;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}}
spring.datasource.username=${SUPABASE_DB_USER:${DB_USER:${DB_USERNAME:sa}}}
spring.datasource.password=${SUPABASE_DB_PASS:${DB_PASS:${DB_PASSWORD:password}}}
spring.datasource.driverClassName=${DB_DRIVER:org.postgresql.Driver}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

# H2 Console — disabled by default in production; set H2_CONSOLE_ENABLED=true locally
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Hibernate Auto-DDL: Set up as update since there are no migration files like Flyway
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

spring.flyway.enabled=false

# Session Cookie Security
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax