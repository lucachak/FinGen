services:
  db:
    image: postgres:15-alpine
    container_name: fingen-db
    environment:
      POSTGRES_USER: ${COMPOSE_DB_USER:-fingen}
      POSTGRES_PASSWORD: ${COMPOSE_DB_PASSWORD:-fingen-local}
      POSTGRES_DB: ${COMPOSE_DB_NAME:-fingen}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${COMPOSE_DB_USER:-fingen} -d ${COMPOSE_DB_NAME:-fingen}"]
      interval: 5s
      timeout: 5s
      retries: 5

  python-ia:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: fingen-python
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "8000:8000"
    environment:
      GEMINI_TOKEN: ${GEMINI_TOKEN:-}
    volumes:
      - ./main.py:/app/main.py

  app:
    build: .
    container_name: fingen-java
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "${APP_PORT:-8081}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${COMPOSE_DB_NAME:-fingen}
      SPRING_DATASOURCE_USERNAME: ${COMPOSE_DB_USER:-fingen}
      SPRING_DATASOURCE_PASSWORD: ${COMPOSE_DB_PASSWORD:-fingen-local}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_TOKEN: ${GEMINI_TOKEN:-}
      JWT_SECRET: ${JWT_SECRET:-}
      PYTHON_API_URL: http://python-ia:8000
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:-20MB}
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:-30MB}
    volumes:
      - app_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      python-ia:
        condition: service_started

volumes:
  postgres_data:
  app_uploads:
