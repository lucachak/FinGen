services:
  # Serviço Único Híbrido (Java + IA Python)
  - type: web
    name: fingen-app
    env: docker
    dockerfilePath: ./Dockerfile.combined
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AI_MODEL_DEFAULT
        value: openrouter/free
      - key: AI_MODEL_FALLBACK
        value: google/gemma-3-27b-it:free
      - key: AI_MODEL_VISION
        value: google/gemma-3-27b-it:free
      - key: AI_ALLOW_PAID_MODELS
        value: false
      - key: PYTHON_API_URL
        value: http://localhost:8000
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DB_ENCRYPTION_KEY
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: true
      - key: SPRING_PROFILES_ACTIVE
        value: prod
