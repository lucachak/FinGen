services:
  # Serviço Único Híbrido (Java + IA Python)
  - type: web
    name: fingen-app
    env: docker
    dockerfilePath: ./Dockerfile.combined
    plan: free
    healthCheckPath: /
    envVars:
      - key: GEMINI_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: PYTHON_API_URL
        value: http://localhost:8000
      - key: DB_URL
        value: jdbc:h2:file:./data/fingen;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
      - key: DB_USERNAME
        value: sa
      - key: DB_PASSWORD
        value: password
      - key: SPRING_PROFILES_ACTIVE
        value: dev